version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tvtracker_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tvtracker
    ports:
      # Loopback only: the backend connects over localhost, so this never
      # needs to be reachable from the LAN.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tvtracker_api
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/tvtracker?schema=public"
      JWT_SECRET: "tvtracker-jwt-secret-replace-in-production"
      APP_BASE_URL: "http://localhost:4000"
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  # Optional Cloudflare Tunnel Service for remote public HTTPS deployment
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tvtracker_cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    depends_on:
      - backend
    profiles:
      - cloudflare

volumes:
  postgres_data:
